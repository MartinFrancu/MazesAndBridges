# Publishes the game to GitHub Pages on every push to main.
# index.html is written without <!doctype>/<head> (claude.ai artifacts add those),
# so the build step wraps it into a complete page.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          { printf '<!doctype html>\n<html lang="en">\n<meta charset="utf-8">\n'; cat index.html; printf '\n</html>\n'; } > _site/index.html
          cp *.js manifest.webmanifest icon-*.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
